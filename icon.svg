<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f6b38" />
      <stop offset="100%" stop-color="#0a4624" />
    </linearGradient>
    <linearGradient id="bar1Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38ef7d" />
      <stop offset="100%" stop-color="#11998e" />
    </linearGradient>
    <linearGradient id="bar2Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="bar3Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9966" />
      <stop offset="100%" stop-color="#ff5e62" />
    </linearGradient>
    <linearGradient id="msGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6d365" />
      <stop offset="100%" stop-color="#fda085" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base Rounded Card -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" filter="url(#shadow)" />
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4" />

  <!-- Grid subtle background lines -->
  <g opacity="0.12" stroke="#ffffff" stroke-width="2">
    <line x1="160" y1="110" x2="160" y2="400" />
    <line x1="240" y1="110" x2="240" y2="400" />
    <line x1="320" y1="110" x2="320" y2="400" />
    <line x1="400" y1="110" x2="400" y2="400" />
  </g>

  <!-- WBS Left Indicator bullets -->
  <g opacity="0.4" fill="#ffffff">
    <circle cx="100" cy="165" r="7" />
    <circle cx="100" cy="235" r="7" />
    <circle cx="100" cy="305" r="7" />
    <circle cx="100" cy="375" r="7" />
  </g>

  <!-- Gantt Bar 1 (Summary/Phase) -->
  <rect x="140" y="145" width="220" height="38" rx="8" fill="url(#bar1Grad)" />
  <polygon points="140,183 148,193 156,183" fill="#11998e" />
  <polygon points="344,183 352,193 360,183" fill="#11998e" />

  <!-- Gantt Bar 2 (Task 1) -->
  <rect x="190" y="215" width="180" height="36" rx="8" fill="url(#bar2Grad)" />
  <!-- Progress fill inside bar 2 -->
  <rect x="190" y="215" width="115" height="36" rx="8" fill="rgba(255,255,255,0.25)" />

  <!-- Gantt Bar 3 (Critical Path Task) -->
  <rect x="270" y="285" width="150" height="36" rx="8" fill="url(#bar3Grad)" />

  <!-- Milestone Diamond -->
  <g transform="translate(425, 375) rotate(45)">
    <rect x="-18" y="-18" width="36" height="36" rx="6" fill="url(#msGrad)" />
  </g>

  <!-- Dependency Connector Lines (Bezier) -->
  <path d="M 370 233 C 390 233, 250 303, 270 303" fill="none" stroke="#ffffff" stroke-width="3.5" opacity="0.85" stroke-dasharray="4,2" />
  <polygon points="270,299 278,303 270,307" fill="#ffffff" opacity="0.9" />

  <path d="M 420 303 C 440 303, 400 375, 415 375" fill="none" stroke="#ffffff" stroke-width="3.5" opacity="0.85" stroke-dasharray="4,2" />

  <!-- App Header 'P' Badge -->
  <g transform="translate(56, 56)">
    <rect x="0" y="0" width="60" height="60" rx="14" fill="#ffffff" />
    <text x="30" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="900" fill="#0f6b38" text-anchor="middle">P</text>
  </g>

  <!-- App Title Text -->
  <text x="130" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="1">ProjectClone</text>
</svg>
